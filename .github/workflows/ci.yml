
name: Code quality and security

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "student/**"
      - "audit/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests and generate JUnit report
        run: python -m pytest -q --junitxml=reports/pytest.xml

      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest.xml
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Ruff quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'

      - name: Run Ruff
        run: ruff check src

  security:
    name: Semgrep security gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install 'semgrep>=1.100,<2'

      - name: Run Semgrep
        run: semgrep scan --config rules/orderflow.yml --error --metrics=off src
